# uWSGI configuration for NyaaV3 production
[uwsgi]
# Application
module = WSGI:app
master = true
enable-threads = true

# Socket and process management
# Serve HTTP directly (so healthchecks and reverse proxies can talk HTTP)
http = :5500
chmod-socket = 660
vacuum = true
die-on-term = true

# Process management
processes = 4
threads = 2
max-requests = 1000
max-requests-delta = 100
harakiri = 60
reload-on-rss = 512

# Worker management
worker-reload-mercy = 60
cheaper = 2
cheaper-initial = 4
cheaper-algo = spare
cheaper-step = 1

# Buffer sizes
buffer-size = 32768
post-buffering = 4096

# Logging
logto = /app/logs/uwsgi.log
log-format = %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)"
log-4xx = true
log-5xx = true

# Stats
stats = /tmp/uwsgi_stats.sock
stats-http = true

# Python optimization
python-autoreload = 0
lazy-apps = true
single-interpreter = true
need-app = true
